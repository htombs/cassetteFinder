<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cassette Finder</title>
    <link
      rel="stylesheet"
      href="css/styles.css"
      media="screen"
      type="text/css"
    />
    <link
      rel="stylesheet"
      href="css/styles_mobile.css"
      media="screen"
      type="text/css"
    />
    <script
      src="https://kit.fontawesome.com/01f26ab4ac.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <header>
      <span class="logo-word">Cassette</span>
      <span class="logo-word">Finder</span>
      <span class="logo-sub">.com</span>
    </header>

    <main>
      <!-- FILTER BAR -->
      <div class="filter-bar" id="filter-bar">
        <div class="filter-group filter-group--wide">
          <label for="search-input">Search</label>
          <input
            type="text"
            id="search-input"
            class="text-input"
            placeholder="Brand, model, part number…"
            autocomplete="off"
          />
        </div>

        <div class="filter-group">
          <label for="speed-select">Speed</label>
          <select id="speed-select">
            <option value="">All speeds</option>
            <option value="8">8 speed</option>
            <option value="9">9 speed</option>
            <option value="10">10 speed</option>
            <option value="11">11 speed</option>
          </select>
        </div>

        <div class="filter-group">
          <label for="ratio-select">Ratio</label>
          <select id="ratio-select">
            <option value="">All ratios</option>
          </select>
        </div>

        <div class="filter-group">
          <label for="brand-select">Brand</label>
          <select id="brand-select">
            <option value="">All brands</option>
          </select>
        </div>

        <button class="btn-reset" id="btn-reset" title="Clear all filters">
          &#8635; Reset
        </button>
      </div>

      <!-- STATUS BAR -->
      <div class="status-bar">
        <span class="result-count" id="result-count">Loading&hellip;</span>
        <span class="filter-chips" id="filter-chips"></span>
      </div>

      <!-- HINT -->
      <p class="hint" id="hint">
        Select a part number from the results below, then follow the
        B2B&nbsp;link to order.
      </p>

      <!-- RESULTS TABLE (desktop) -->
      <div class="table-wrap">
        <table id="results-table">
          <thead>
            <tr>
              <th data-col="brand">
                Brand <span class="sort-icon">&#8597;</span>
              </th>
              <th data-col="model">
                Model <span class="sort-icon">&#8597;</span>
              </th>
              <th data-col="speed">
                Speed <span class="sort-icon">&#8597;</span>
              </th>
              <th data-col="ratio">
                Ratio <span class="sort-icon">&#8597;</span>
              </th>
              <th data-col="part_number">
                Part Number <span class="sort-icon">&#8597;</span>
              </th>
              <th data-col="rrp">
                Price <span class="sort-icon">&#8597;</span>
              </th>
              <th data-col="distributor">
                Distributor <span class="sort-icon">&#8597;</span>
              </th>
              <th>B2B Link</th>
            </tr>
          </thead>
          <tbody id="output"></tbody>
        </table>

        <div class="empty-state" id="empty-state">
          <div class="empty-icon">&#9881;</div>
          <h3>No cassettes found</h3>
          <p>Try adjusting your filters or clearing the search.</p>
          <button class="btn-reset btn-reset--inline" id="btn-reset-empty">
            Clear filters
          </button>
        </div>

        <div class="loading-state" id="loading-state">
          <div class="spinner"></div>
          <p>Loading cassettes&hellip;</p>
        </div>
      </div>

      <!-- MOBILE CARDS -->
      <div class="mobile-cards" id="mobile-cards"></div>
    </main>

    <footer>
      <button
        onclick="window.scrollTo({ top: 0, behavior: 'smooth' })"
        id="scrollToTopBtn"
        title="Back to top"
      >
        &#8593; Back to top
      </button>
    </footer>

    <script src="js/script.js"></script>
  </body>
</html>
